<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Forms</title>
  </head>
  <body>
    <fieldset>
      <legend align="center">Basic Form</legend>
      <form>
        <label for="fullName">Full Name :</label>
        <input
          type="text"
          name="fullName"
          id="fullName"
          placeholder="Your Name"
        />

        <br />
        <br />
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" placeholder="Your email" />

        <br />
        <br />
        <label for="password">Password :</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Your password"
        />

        <br />
        <br />
        <label for="cfpassword">Confirm Password :</label>
        <input
          type="password"
          name="cfpassword"
          id="cfpassword"
          placeholder="Confirm your password"
        />

        <br />
        <br />
        <label for="dob">Date of Birth :</label>
        <input type="date" name="dob" id="dob" />

        <br />
        <br />
        <label for="tob">Time of Birth :</label>
        <input type="time" name="tob" id="tob" />

        <br />
        <br />
        <label for="joiningTime">Joining Time :</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime" />

        <br />
        <br />
        <label for="volume">Volume :</label>
        <input
          type="range"
          name="volume"
          id="volume"
          min="0"
          max="10"
          value="3"
        />

        <br />
        <br />
        <label for="mobile">Mobile :</label>
        <input type="number" name="mobile" id="mobile" />

        <br />
        <br />
        <label for="resume">Resume :</label>
        <input type="file" name="resume" id="resume" />

        <br />
        <br />
        <label for="address">Address :</label>
        <textarea name="address" id="address"></textarea>

        <br />
        <br />
        <label for="course">Course :</label>
        <select name="course" id="course">
          <option value="">--Select Course--</option>
          <option value="btech">B Tech</option>
          <option value="bba">BBA</option>
          <option value="mtech">M Tech</option>
          <option value="mba">MBA</option>
        </select>

        <br />
        <br />
        <label for="gender">Gender :</label>
        <input type="radio" name="gender" id="male" value="male" />
        <span>Male</span>
        <input type="radio" name="gender" id="female" value="female" />
        <span>Female</span>
        <input type="radio" name="gender" id="others" value="others" />
        <span>Others</span>

        <br />
        <br />
        <label for="skillset">Skill Set :</label>
        <input type="checkbox" name="skillset" id="java" value="java" />
        <span>Java</span>
        <input type="checkbox" name="skillset" id="dsa" value="dsa" />
        <span>DSA</span>
        <input type="checkbox" name="skillset" id="html" value="html" />
        <span>HTML</span>

        <br />
        <br />
        <button>Submit</button>
      </form>
    </fieldset>

    <img
      src="./Magnolia_grandiflora_-_flower_1.jpg"
      alt=""
      width="200px"
      height="100px"
    />
  </body>
</html>
